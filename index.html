{id:1,t:"Salé",s:"Printemps",k:420,n:"Pancakes protéinés aux jeunes pousses d'épinards",
ing:["100g pousses d'épinards frais","2 œufs entiers","100g yaourt grec 0%","40g farine complète","Levure chimique","Sel, poivre"],
prep:["Placer tous les ingrédients dans un blender et mixer 1 minute jusqu'à obtenir une pâte lisse et verte.","Chauffer une poêle antiadhésive essuyée avec un sopalin imbibé d'une goutte d'huile.","Verser de petites louches de pâte. Cuire 2 min par face.","Servir chaud, idéalement tartiné avec un houmous léger ou 30g de chèvre frais."],
sci:"La caséine du yaourt grec offre une digestion biphasique très lente. L'épinard apporte un volume aqueux massif pour un coût calorique virtuellement nul, distendant les parois de l'estomac de manière mécanique."},

{id:2,t:"Salé",s:"Printemps",k:410,n:"Œufs cocotte printaniers au saumon et poireau",
ing:["2 œufs","1 blanc de poireau","60g saumon fumé","1 c.à.s crème fraîche allégée (15%)","10g parmesan","Aneth"],
prep:["Émincer finement le blanc de poireau et le faire fondre à la poêle avec un fond d'eau.","Dans des ramequins, disposer la fondue de poireau au fond, ajouter le saumon fumé en lanières.","Casser un œuf par ramequin, ajouter une demi-cuillère de crème et saupoudrer de parmesan.","Cuire au bain-marie au four à 180°C pendant 12 à 15 minutes (blanc figé, jaune coulant)."],
sci:"La matrice lipidique du saumon (oméga-3) ralentit la vidange gastrique. Les fibres prébiotiques du poireau nourrissent le microbiote intestinal, favorisant la sécrétion de butyrate, puissant régulateur de l'appétit."},

{id:3,t:"Salé",s:"Printemps",k:440,n:"Risotto allégé aux asperges vertes du terroir",
ing:["50g riz Arborio cru","150g pointes d'asperges vertes","Bouillon de volaille dégraissé","20g parmesan affiné","100g émincé de volaille","Oignon"],
prep:["Faire suer l'oignon haché à sec, ajouter le riz nacré.","Déglacer avec une louche de bouillon chaud. Ajouter le bouillon louche par louche pendant 18 min.","À 5 min de la fin, ajouter les asperges coupées en tronçons (blanchies 2 min).","Hors du feu, lier avec le parmesan et intégrer la volaille grillée à part."],
sci:"La restriction de la charge glucidique (50g de riz cru) est compensée par le volume imposant des asperges, légume diurétique par excellence. Le parmesan apporte la signature umami nécessaire à la satiété sensorielle."},

{id:4,t:"Salé",s:"Printemps",k:400,n:"Velouté de carottes primeur et pommes de terre au tofu",
ing:["150g pommes de terre nouvelles","2 carottes primeur","Gousse d'ail","Bouillon végétal","100g de tofu soyeux"],
prep:["Peler et couper les légumes en cubes. Les immerger dans le bouillon avec l'ail écrasé et cuire 20 min.","Mixer le tout au mixeur plongeant.","Couper le tofu soyeux en dés, le griller à sec avec un peu de sauce soja.","Déposer le tofu grillé sur le velouté au moment du service."],
sci:"Le mixage en velouté augmente la viscosité du bol alimentaire. Le tofu abaisse la charge glycémique, empêchant l'effondrement glycémique classique après l'ingestion de soupes."},

{id:5,t:"Salé",s:"Printemps",k:420,n:"Salade d'artichauts poivrade, fèves et Pélardon",
ing:["3 fonds d'artichauts","80g fèves fraîches écossées","30g de Pélardon des Cévennes","10g d'huile d'olive","Jus de citron","Lit de roquette"],
prep:["Tourner les artichauts pour ne garder que le cœur, les émincer finement et les citronner.","Blanchir les fèves 3 minutes, les rafraîchir et les peler.","Dresser sur un lit massif de roquette, disposer les artichauts et les fèves.","Émietter le Pélardon et arroser de vinaigrette (huile d'olive + citron)."],
sci:"Les fèves combinent protéines végétales et amidon résistant. Les 30g de Pélardon délivrent des acides gras essentiels à chaîne moyenne pour un plaisir gustatif optimisé sans excès."},

{id:6,t:"Salé",s:"Printemps",k:410,n:"Rouleaux de printemps arc-en-ciel végétariens",
ing:["3 feuilles de riz","Chou rouge râpé","Julienne de carottes","Concombre en bâtonnets","80g tofu ferme","Sauce : 15g purée de cacahuète, eau, citron"],
prep:["Tremper les feuilles de riz dans l'eau tiède pour les ramollir.","Disposer au centre le chou rouge, la carotte, le concombre et des bâtonnets de tofu poêlés.","Replier les bords et rouler serré.","Diluer la purée de cacahuète avec de l'eau tiède et du citron pour la sauce."],
sci:"Les glucides complexes de la feuille de riz, couplés aux lipides insaturés de la purée d'arachide et aux protéines du soja, assurent une libération d'énergie linéaire et durable."},

{id:7,t:"Salé",s:"Printemps",k:400,n:"Dos de truite sur tombée de fanes et radis poêlés",
ing:["120g filet de truite","Fanes d'une botte de radis","150g radis roses","100g quinoa cuit","Jus de citron"],
prep:["Cuire le quinoa à l'eau. Laver les radis en conservant leurs fanes.","Faire revenir les radis entiers avec un fond d'eau 10 min jusqu'à ce qu'ils soient fondants.","Ajouter les fanes en fin de cuisson pour les faire tomber.","Cuire la truite à la vapeur douce 8 minutes. Dresser sur le lit de fanes et de quinoa."],
sci:"La cuisson du radis neutralise ses isothiocyanates piquants et le rend fondant. La truite fournit les protéines structurelles et les acides gras protecteurs."},

{id:8,t:"Salé",s:"Printemps",k:440,n:"Omelette volumique aux blettes et oignons nouveaux",
ing:["2 œufs entiers","2 blancs d'œufs supplémentaires","150g feuilles et côtes de blettes","Oignons cébettes","40g pain de seigle"],
prep:["Séparer le vert du blanc des blettes. Émincer les côtes et les cuire 10 min à l'eau bouillante.","Faire suer la cébette, ajouter les côtes cuites et le vert émincé.","Battre les 2 œufs entiers avec les 2 blancs, assaisonner, verser sur les légumes.","Cuire à feu doux à couvert. Servir avec le pain de seigle."],
sci:"L'ajout de blancs d'œufs décuple le volume et l'apport en acides aminés sans impact lipidique. Le pain de seigle exige une mastication longue et laborieuse."},

{id:9,t:"Salé",s:"Printemps",k:410,n:"Salade protéinée aux épinards et fraises",
ing:["Grande quantité de jeunes pousses d'épinards","100g fraises fraîches","120g filet de poulet","15g cerneaux de noix","Réduction de vinaigre balsamique"],
prep:["Aplatir le filet de poulet, le griller à sec, puis le tailler en aiguillettes.","Équeuter et couper les fraises en quartiers.","Mélanger les pousses d'épinards, les fraises, les noix et le poulet tiède.","Arroser d'une réduction de vinaigre balsamique (vinaigre bouilli jusqu'à consistance sirupeuse)."],
sci:"Le contraste sucré-salé masque la perception de la restriction calorique. La vitamine C des fraises catalyse l'absorption du fer végétal des épinards."},

{id:10,t:"Salé",s:"Printemps",k:450,n:"Sauté de porc maigre aux navets nouveaux glacés",
ing:["120g filet mignon de porc","150g petits navets printaniers","1 c.à.c miel","Sauce soja","Oignon","100g riz complet"],
prep:["Couper le filet mignon en dés. Peler et couper les navets en rondelles.","Mélanger sauce soja, miel et oignon émincé avec la viande pour mariner.","Faire revenir les navets avec un filet d'eau, retirer. Saisir la viande marinée.","Rajouter les navets et la marinade. Mijoter 20 min à couvert. Servir avec le riz complet."],
sci:"Le filet mignon est la coupe la plus maigre du porc. Le micro-glaçage au miel offre une caramélisation satisfaisante (réaction de Maillard) tout en respectant le budget glucidique."},

{id:11,t:"Salé",s:"Printemps",k:390,n:"Râpée de chou-rave, pomme verte et dinde effilochée",
ing:["150g chou-rave cru","½ pomme Granny Smith","120g blanc de dinde cuit","Yaourt bulgare","1 c.à.c moutarde ancienne","Citron"],
prep:["Peler le chou-rave et le râper finement. Couper la pomme en julienne ou la râper.","Effilocher le blanc de dinde préalablement poché ou rôti.","Mélanger le yaourt avec la moutarde et un trait de citron.","Amalgamer l'ensemble des ingrédients avec la sauce dans un grand bol."],
sci:"Le croquant extrême du chou-rave cru impose un travail mécanique des mâchoires prolongé, laissant le temps à l'hypothalamus d'enregistrer les signaux de satiété précoce."},

{id:12,t:"Salé",s:"Printemps",k:400,n:"Cabillaud en croûte d'herbes et jardinière de pois",
ing:["130g dos de cabillaud","10g chapelure fine","Persil, cerfeuil","100g petits pois frais écossés","100g jeunes carottes"],
prep:["Mélanger la chapelure avec les herbes hachées. Presser sur le dos de cabillaud.","Enfourner à 200°C pendant 12 à 15 min.","Cuire les petits pois et les carottes en bâtonnets à la vapeur douce 10 min.","Servir le poisson croustillant sur les légumes vapeur."],
sci:"Les petits pois agissent comme légume fibreux et féculent doux. Le cabillaud (moins de 2% de lipides) offre une très haute teneur protidique idéale pour la plénitude."},

{id:13,t:"Salé",s:"Printemps",k:440,n:"Wok de volaille aux haricots mange-tout et sésame",
ing:["120g émincé de poulet","150g haricots gourmands (mange-tout)","1 c.à.s graines de sésame","100g nouilles de sarrasin (soba)","Sauce soja"],
prep:["Cuire les nouilles soba à l'eau bouillante 4 min, égoutter.","Dans un wok très chaud, saisir l'émincé de poulet sans matière grasse.","Ajouter les haricots mange-tout, faire sauter 5 min pour qu'ils restent croquants.","Déglacer avec la sauce soja, intégrer les nouilles et saupoudrer de sésame torréfié."],
sci:"Les fibres solubles des haricots gourmands et insolubles du sarrasin optimisent le péristaltisme intestinal. Le sésame apporte calcium biodisponible et lipides monoinsaturés."},

{id:14,t:"Salé",s:"Printemps",k:430,n:"Bowl printanier végétarien quinoa, asperges et œuf",
ing:["100g quinoa blond cuit","100g têtes d'asperges","1 œuf entier","30g houmous maison","Jus de citron pressé","Coriandre"],
prep:["Rincer et cuire le quinoa par absorption.","Cuire l'œuf exactement 6 minutes pour un œuf mollet, refroidir dans l'eau glacée.","Cuire les asperges à la vapeur 5 min.","Disposer le quinoa tiède, les asperges, le houmous, et l'œuf mollet ouvert au centre."],
sci:"Le quinoa est l'une des rares protéines végétales contenant tous les acides aminés essentiels. Associé à l'œuf, il offre un aminogramme parfait pour la masse musculaire."},

{id:15,t:"Salé",s:"Printemps",k:420,n:"Salade de lentilles vertes, rondelles de radis et feta",
ing:["120g lentilles vertes (poids cuit)","Radis roses","30g feta AOP émiettée","Ciboulette","1 c.à.s huile d'olive","Vinaigre de cidre"],
prep:["Cuire les lentilles avec un bouquet garni, égoutter et refroidir au réfrigérateur (étape cruciale).","Couper les radis en très fines rondelles.","Mélanger les lentilles froides avec les radis, la ciboulette, l'huile d'olive et le vinaigre.","Parsemer la feta émiettée sur le dessus au moment de servir."],
sci:"Le refroidissement des lentilles crée de l'amidon résistant qui abaisse l'indice glycémique du repas, prévenant les pics d'insuline responsables du stockage adipeux."},

{id:16,t:"Salé",s:"Printemps",k:430,n:"Mijoté de veau léger aux carottes primeur et estragon",
ing:["120g noix de veau en dés","200g jeunes carottes fanes","100g pommes de terre","Bouillon de légumes","Estragon frais"],
prep:["Faire dorer les dés de veau à sec dans une cocotte antiadhésive.","Déglacer avec une louche de bouillon. Ajouter les carottes et les pommes de terre.","Verser le bouillon à hauteur, ajouter l'estragon. Couvrir hermétiquement.","Laisser mijoter à feu très doux pendant 40 minutes."],
sci:"La cuisson à l'étouffée attendrit les fibres collagéniques sans aucun ajout de matières grasses. Les carottes primeur libèrent leur bêta-carotène antioxydant dans le jus."},

{id:17,t:"Salé",s:"Printemps",k:400,n:"Tarte fine aux courgettes primeur sur pâte filo",
ing:["3 feuilles de pâte filo","Petites courgettes nouvelles","1 œuf","50g ricotta","Basilic frais"],
prep:["Superposer les 3 feuilles de pâte filo dans un petit moule à tarte (sans beurrer).","Battre l'œuf avec la ricotta, assaisonner, étaler sur le fond.","Disposer les rondelles de courgettes tranchées à la mandoline en rosace.","Enfourner à 180°C pendant 20 minutes jusqu'à ce que les bords soient dorés."],
sci:"3 feuilles de pâte filo ultra-fines remplacent une pâte brisée classique, économisant près de 150 kcal tout en conservant une texture croustillante."},

{id:18,t:"Salé",s:"Printemps",k:410,n:"Tartare de saumon à la ciboulette et concombre cru",
ing:["100g saumon frais qualité sashimi","¼ concombre","Jus de citron vert","Ciboulette, aneth","40g pain de seigle"],
prep:["Placer le saumon 15 min au congélateur pour faciliter la découpe.","Tailler en très petits cubes au couteau. Couper le concombre en brunoise, faire dégorger au sel.","Mélanger poisson et concombre avec le jus de citron vert et les herbes.","Servir immédiatement avec la tranche de pain de seigle toastée."],
sci:"L'acidité citrique coagule partiellement les protéines du poisson, facilitant le travail enzymatique gastrique. Le pain de seigle garantit une libération d'énergie très lente."},

{id:19,t:"Salé",s:"Printemps",k:430,n:"Salade d'épeautre aux petits oignons blancs et thon",
ing:["100g petit épeautre cuit al dente","1 boîte thon au naturel (100g égoutté)","Oignons blancs printaniers","Tomates cerises","Citron"],
prep:["Faire tremper l'épeautre la veille, puis le cuire 45 min à l'eau bouillante salée. Égoutter et refroidir.","Mélanger l'épeautre avec le thon émietté grossièrement.","Ajouter les petits oignons blancs coupés finement (avec la tige verte) et les tomates cerises coupées en deux.","Assaisonner d'un filet de jus de citron et de poivre noir."],
sci:"L'épeautre est une céréale ancienne dont la matrice protéique rustique nécessite un effort enzymatique supérieur, augmentant l'effet thermogénique et la durée de la satiété."},

{id:20,t:"Salé",s:"Printemps",k:400,n:"Filet de loup de mer rôti, fenouil et pomelo",
ing:["130g filet de loup de mer","150g bulbe de fenouil","Suprêmes d'un demi-pomelo","5g huile d'olive (1 c.à.c)","Aneth"],
prep:["Émincer le fenouil finement à la mandoline.","Peler le pomelo à vif pour extraire les suprêmes.","Mélanger le fenouil et le pomelo en salade.","Cuire le filet à la poêle avec l'huile d'olive (cuisson unilatérale côté peau). Servir sur la salade froide."],
sci:"Le loup de Méditerranée est sublimé par l'anethol du fenouil. L'acide ascorbique du pomelo protège les acides gras cellulaires de l'oxydation lors de la digestion."},

{id:21,t:"Salé",s:"Printemps",k:410,n:"Mini-frittatas aux épinards et fromage de chèvre",
ing:["2 œufs entiers","100g d'épinards frais","30g de bûche de chèvre","Sel, poivre","Grand bol de salade verte"],
prep:["Faire tomber les épinards dans une poêle sans graisse, bien les presser.","Battre les œufs. Dans des moules à muffins en silicone, répartir épinards et chèvre en dés.","Verser les œufs battus par-dessus.","Enfourner à 180°C pendant 15 minutes jusqu'à ce qu'elles soient gonflées."],
sci:"Repas à très forte densité protéique et calcique. La cuisson en moules silicone élimine le besoin d'huiler, contrôlant rigoureusement le bilan lipidique."},

{id:22,t:"Salé",s:"Printemps",k:420,n:"Blanc de volaille farci à la rhubarbe et gingembre",
ing:["120g filet de volaille","1 bâton de rhubarbe","Gingembre frais râpé","100g semoule complète cuite"],
prep:["Peler et couper la rhubarbe, la compoter avec le gingembre et un fond d'eau (sans sucre).","Ouvrir le filet en portefeuille, farcir avec la compotée acidulée.","Refermer avec des cure-dents. Rôtir au four à 200°C pendant 20 minutes.","Servir avec la semoule."],
sci:"L'acidité malique de la rhubarbe attendrit les fibres musculaires de la volaille, offrant un plat juteux malgré l'absence de sauce grasse ou de crème."},

{id:23,t:"Salé",s:"Printemps",k:410,n:"Papillote de lieu noir aux poireaux nouveaux et soja",
ing:["150g filet lieu noir","150g émincé de poireaux primeur","1 c.à.s crème de soja","Trait de vin blanc sec","100g de riz blanc cuit"],
prep:["Découper un carré de papier sulfurisé. Disposer une base de poireaux émincés crus.","Déposer le filet de poisson par-dessus.","Arroser de crème de soja, vin blanc, saler et poivrer. Refermer hermétiquement.","Cuire au four à 200°C pendant 15 minutes. Servir avec le riz."],
sci:"L'environnement fermé de la papillote cuit le poisson dans son propre exsudat tout en préservant le volume des légumes, garantissant une plénitude stomacale maximale."},

{id:24,t:"Salé",s:"Printemps",k:380,n:"Faux taboulé de chou-fleur, herbes et crevettes",
ing:["150g bouquets de chou-fleur cru","Menthe fraîche, persil plat","120g crevettes décortiquées","Jus de citron","1 c.à.s huile d'olive"],
prep:["Râper ou mixer le chou-fleur cru par impulsions pour obtenir une texture de semoule.","Hacher massivement les herbes (un grand bol).","Mélanger la semoule de chou-fleur, les herbes, les crevettes coupées en deux, le citron et l'huile.","Laisser mariner au frais."],
sci:"La substitution de la semoule de blé par du chou-fleur cru réduit l'apport glucidique de plus de 70%, assurant une satiété mécanique absolue pour très peu de calories."},

{id:25,t:"Salé",s:"Printemps",k:450,n:"Gnocchis poêlés aux asperges vertes et parmesan",
ing:["150g gnocchis de pomme de terre","150g pointes d'asperges vertes","15g copeaux de parmesan","Ail","1 c.à.c huile d'olive"],
prep:["Blanchir les asperges 3 minutes, rafraîchir et couper en tronçons.","Chauffer l'huile dans une poêle antiadhésive, faire dorer les gnocchis directement (sans bouillir) 8 min.","Ajouter l'ail écrasé et les asperges, faire sauter 2 min.","Hors du feu, parsemer de copeaux de parmesan."],
sci:"Les gnocchis offrent une densité calorique volumétrique inférieure aux pâtes grâce à leur forte teneur en eau interne. Le parmesan concentre la saveur umami, limitant la sensation de restriction."},

// ─── ÉTÉ ───
{id:26,t:"Salé",s:"Été",k:430,n:"Salade Niçoise authentique du patrimoine azuréen",
ing:["1 œuf dur","80g thon au naturel","3 filets d'anchois","Tomates charnues","Poivron vert, cébettes, radis","5 olives noires de Nice","1 c.à.s huile d'olive"],
prep:["Cuire l'œuf 9 min. Couper les tomates en quartiers, émincer le poivron vert et les radis.","Frotter le saladier avec une gousse d'ail coupée en deux.","Dresser les légumes, ajouter le thon émietté, l'œuf en quartiers, les anchois et les olives.","Assaisonner avec l'huile d'olive et un peu de vinaigre (sans pommes de terre)."],
sci:"Le strict respect de la recette authentique (sans pommes de terre) maintient une charge glycémique très basse. Les lipides des olives et anchois modulent la cinétique d'absorption au duodénum."},

{id:27,t:"Salé",s:"Été",k:420,n:"Brochettes de poulet au citron et courgettes grillées",
ing:["150g cubes de blanc de poulet","Jus de citron, romarin, ail","Courgettes","100g boulgour cuit"],
prep:["Mariner les cubes de poulet dans le citron, l'ail et le romarin pendant 1h au frais.","Tailler les courgettes en épaisses rondelles. Embrocher la viande en alternant avec les courgettes.","Cuire au barbecue ou sous le gril 15 minutes en retournant régulièrement.","Servir avec le boulgour chaud ou froid."],
sci:"La cuisson par rayonnement direct permet d'économiser les lipides de cuisson. Ces calories sont réinvesties dans le boulgour, céréale riche en vitamines du groupe B."},

{id:28,t:"Salé",s:"Été",k:400,n:"Ratatouille méridionale express et œufs pochés",
ing:["250g ratatouille maison (tomates, courgettes, aubergines)","2 œufs","40g tranche de pain de campagne"],
prep:["Confectionner une ratatouille en étuvant les dés de légumes d'été sans excès d'huile.","Réchauffer la portion dans une poêle. Créer deux puits dans les légumes chauds.","Y casser les œufs. Couvrir et laisser mijoter 4 minutes (blanc pris, jaune coulant).","Manger avec la tranche de pain."],
sci:"Le volume des fibres végétales solubles de la ratatouille compense la restriction calorique. Le jaune d'œuf coulant sert de liant lipidique riche en choline, essentielle au métabolisme hépatique."},

{id:29,t:"Salé",s:"Été",k:410,n:"Salade Grecque traditionnelle et dés de pastèque",
ing:["Tomates mûres, concombre, oignon rouge","40g Feta AOP","5 olives Lucques d'Occitanie","Origan séché","1 c.à.c huile d'olive","150g dés de pastèque fraîche"],
prep:["Tailler les tomates et le concombre en gros cubes. Émincer l'oignon rouge.","Mélanger les légumes, ajouter la Feta en dés et les olives Lucques.","Saupoudrer d'origan et arroser d'huile d'olive.","Consommer les dés de pastèque bien frais en dessert hydratant."],
sci:"La pastèque restaure le flux hydrique. Les olives Lucques d'Occitanie offrent des acides gras monoinsaturés de qualité supérieure, luttant contre l'inflammation systémique."},

{id:30,t:"Salé",s:"Été",k:450,n:"Sardines de Méditerranée grillées au citron",
ing:["120g sardines fraîches écaillées et vidées","Jus de citron jaune","Grand bol de salade verte variée","100g pommes de terre cuites vapeur"],
prep:["Disposer les sardines entières sur une grille au four ou au barbecue.","Les cuire très rapidement (3 à 4 minutes par face).","Arroser généreusement de jus de citron jaune frais.","Servir avec les pommes de terre vapeur saupoudrées de gros sel et la salade verte."],
sci:"Les sardines entières sont des bombes nutritionnelles d'oméga-3, de calcium et de vitamine D. L'acide citrique facilite la digestion de cette matrice lipidique dense."},

{id:31,t:"Salé",s:"Été",k:420,n:"Ceviche de loup de mer aux pêches et piment doux",
ing:["120g filet de loup frais cru","Jus de 2 citrons verts","Coriandre fraîche","½ pêche jaune d'été","30g avocat","Pointe de piment doux"],
prep:["Couper le loup en petits dés réguliers.","Le recouvrir de jus de citron vert, réfrigérer 20 min jusqu'à ce que la chair blanchisse.","Ajouter la pêche et l'avocat en brunoise, la coriandre et le piment.","Mélanger délicatement et servir très frais dans une coupe."],
sci:"L'acidité dénature les protéines du loup. Le gras de l'avocat tempère la capsaïcine du piment, protégeant l'intégrité de la muqueuse gastrique."},

{id:32,t:"Salé",s:"Été",k:410,n:"Bruschettas italiennes aux tomates cerises et ail",
ing:["80g (2 grandes tranches) pain complet","150g tomates cerises concassées","30g mozzarella di bufala","1 gousse d'ail crue","Basilic"],
prep:["Griller les tranches de pain complet.","Frotter vigoureusement la mie encore chaude avec l'ail coupé en deux.","Mélanger les tomates concassées avec le basilic ciselé, sel et poivre. Répartir sur les tartines.","Disposer la mozzarella finement tranchée ou déchirée par-dessus."],
sci:"L'ail frotté à cru libère de l'allicine, un composé sulfuré hypotenseur. La mozzarella di bufala apporte protéines lactées à digestion lente et lipides nécessaires."},

{id:33,t:"Salé",s:"Été",k:440,n:"Taboulé oriental au poulet épicé et herbes fraîches",
ing:["50g semoule complète crue","100g filet de poulet","Cumin, paprika","Bouquet massif de menthe et persil plat","Dés de tomates","Citron"],
prep:["Réhydrater la semoule à l'eau froide avec le jus de citron (sans huile).","Hacher très fin la menthe et le persil (le volume d'herbes doit égaler le volume de semoule).","Ajouter les dés de tomates.","Griller le poulet enrobé de cumin et paprika à sec, le couper en dés et l'incorporer à froid."],
sci:"Le volume d'herbes fraîches apporte des fibres insolubles et de la chlorophylle pour quasiment zéro calorie, abaissant la densité énergétique du repas."},

{id:34,t:"Salé",s:"Été",k:400,n:"Brochettes de crevettes à l'ail et ananas rôti",
ing:["150g grosses crevettes décortiquées","2 gousses d'ail hachées","1 tranche épaisse d'ananas frais","100g riz basmati nature cuit"],
prep:["Embrocher les crevettes et les badigeonner d'ail haché.","Saisir la tranche d'ananas et les brochettes sur une plancha très chaude (2 min par face).","Le sucre de l'ananas va caraméliser au contact de la chaleur.","Servir avec l'ananas grillé et le riz basmati."],
sci:"Sous l'effet de la chaleur, l'ananas libère de la bromélaïne qui facilite la digestion du collagène et des protéines marines. Plat extrêmement pauvre en graisses."},

{id:35,t:"Salé",s:"Été",k:430,n:"Tacos légers aux crevettes et salsa crue de mangue",
ing:["2 petites tortillas de maïs","100g crevettes décortiquées","¼ mangue","Oignon rouge, coriandre","Chou rouge émincé","Citron vert"],
prep:["Préparer la salsa : couper la mangue et l'oignon rouge en brunoise, mélanger avec la coriandre et le citron vert.","Faire sauter les crevettes rapidement à la poêle.","Réchauffer les tortillas de maïs.","Garnir chaque tortilla de chou rouge, crevettes chaudes et salsa de mangue."],
sci:"Les tortillas de maïs pur affichent un comportement glycémique supérieur à celles au blé industriel. La salsa crue apporte fraîcheur sans huiles cachées."},

{id:36,t:"Salé",s:"Été",k:390,n:"Tzatziki bowl au concombre, menthe et blanc de volaille",
ing:["1 gros concombre","150g yaourt nature ou grec léger (0 à 2%)","Menthe fraîche","Ail haché","100g blanc de dinde froid rôti"],
prep:["Râper grossièrement le concombre et le presser fortement pour en extraire l'eau.","Mélanger le concombre essoré avec le yaourt, l'ail, la menthe ciselée, sel et poivre.","Servir dans un bol profond.","Surmonter du blanc de dinde coupé en fines lamelles."],
sci:"Repas ultra-hydratant idéal en canicule. L'osmolarité du plat assure une vidange gastrique millimétrée, prévenant toute sensation de lourdeur estivale."},

{id:37,t:"Salé",s:"Été",k:420,n:"Salade de melon, jambon de Parme et mozzarella",
ing:["¼ melon type charentais","2 tranches fines de jambon de Parme","30g billes de mozzarella","Poivre noir du moulin","Basilic"],
prep:["Couper le quart de melon en billes ou en dés.","Dégraisser les tranches de jambon (retirer le gras blanc).","Disposer melon, jambon en chiffonnade et mozzarella sur une assiette.","Poivrer généreusement et garnir de basilic (aucun sel ni huile)."],
sci:"L'association du fructose du melon et du sel du jambon cru restaure l'équilibre électrolytique perturbé par la sudation, tout en fournissant des protéines de qualité."},

{id:38,t:"Salé",s:"Été",k:400,n:"Caviar d'aubergines express et lanières de poulet",
ing:["1 belle aubergine","Ail, cumin en poudre","1 c.à.s huile d'olive (10g)","120g lanières de poulet","Bâtonnets de crudités (carottes/concombre)"],
prep:["Piquer l'aubergine et la cuire au four à 200°C pendant 45 min.","Couper en deux, récupérer la pulpe. Mixer avec l'ail, le cumin, l'huile d'olive et du sel.","Poêler le poulet.","Servir le caviar d'aubergines froid avec le poulet et les crudités pour tremper."],
sci:"Cuire l'aubergine entière avec sa peau avant le mixage limite drastiquement l'absorption lipidique, sauvant des centaines de calories."},

{id:39,t:"Salé",s:"Été",k:410,n:"Moules marinières estivales et pain complet",
ing:["500g de moules fraîches (coquilles incluses)","Verre de vin blanc sec","1 oignon","Persil frais","40g (2 tranches) de pain complet"],
prep:["Gratter et laver les moules. Faire suer l'oignon émincé dans une cocotte.","Ajouter le vin blanc, porter à ébullition. Jeter les moules, couvrir.","Cuire à feu vif 5 à 7 minutes en secouant jusqu'à ouverture. Ajouter le persil.","Servir avec le pain pour éponger le bouillon iodé."],
sci:"Les mollusques bivalves offrent une densité exceptionnelle en protéines, vitamine B12, sélénium et zinc pour un coût calorique marginal. Le bouillon iodé régule la thyroïde."},

{id:40,t:"Salé",s:"Été",k:440,n:"Pâtes froides au pesto allégé et pignons de pin",
ing:["50g pâtes sèches (penne ou fusilli)","Pesto allégé : basilic frais, 1 c.à.s huile d'olive, 10g pignons, ail, eau","Tomates cerises","80g tofu ferme"],
prep:["Cuire les pâtes al dente, égoutter et refroidir sous l'eau froide.","Au mortier ou mixeur, broyer basilic, ail, pignons et huile en ajoutant de l'eau de cuisson pour fluidifier.","Mélanger les pâtes froides avec le pesto, les tomates cerises et les dés de tofu.","Servir bien frais."],
sci:"Le refroidissement des pâtes cuites crée de l'amidon résistant indigeste. Ce phénomène abaisse l'apport calorique net et nourrit directement la flore colique."},

{id:41,t:"Salé",s:"Été",k:450,n:"Satay de porc maigre au barbecue et courgettes",
ing:["120g filet mignon de porc","Sauce satay : 1 c.à.c beurre de cacahuète, sauce soja, eau ou yaourt","Courgettes","100g riz"],
prep:["Couper le porc en cubes, les embrocher.","Diluer la purée de cacahuète avec sauce soja et eau pour une sauce fluide, badigeonner la viande.","Griller les brochettes et les courgettes au barbecue.","Servir avec le riz chaud."],
sci:"La sauce aux arachides stratégiquement diluée conserve son pouvoir aromatique puissant sans faire exploser le compteur lipidique et calorique."},

{id:42,t:"Salé",s:"Été",k:390,n:"Gaspacho andalou authentique et œufs durs",
ing:["250ml de gaspacho maison (tomate, poivron rouge, concombre, vinaigre, ail)","2 œufs durs","1 c.à.s huile d'olive crue"],
prep:["Mixer finement les légumes d'été épluchés avec le vinaigre et de l'eau glacée.","Ajouter l'huile d'olive en filet à la fin du mixage.","Servir très frais.","Écaler les deux œufs durs et les couper en quartiers pour accompagner."],
sci:"Le gaspacho non filtré conserve l'intégralité des fibres pelliculaires des légumes. Les œufs entiers assurent la plénitude protéique et lipidique nécessaire à ce repas liquide."},

{id:43,t:"Salé",s:"Été",k:440,n:"Bol méditerranéen poulet, quinoa et olives Lucques",
ing:["100g blanc de poulet","100g quinoa blond cuit","6 olives Lucques du Languedoc","Concombre en dés","Jus de citron jaune"],
prep:["Cuire le blanc de poulet à la vapeur ou grillé à sec, le couper en lamelles.","Dénoyauter et hacher les olives Lucques.","Mélanger le quinoa tiède ou froid, les dés de concombre, le poulet et les olives.","Arroser généreusement de jus de citron."],
sci:"L'olive Lucques d'Occitanie possède une pulpe douce et charnue. Ce bol regroupe les trois macronutriments en proportion idéale."},

{id:44,t:"Salé",s:"Été",k:450,n:"Gnocchis One-Pot aux tomates fraîches et mozzarella",
ing:["150g gnocchis frais","300g tomates fraîches mûres","Basilic","Oignon","30g mozzarella","1 c.à.c d'huile d'olive"],
prep:["Faire revenir l'oignon et les tomates coupées avec l'huile d'olive. Laisser compoter.","Plonger les gnocchis directement dans cette sauce bouillonnante (sans les précuire).","Cuire par absorption à couvert pendant 5 min.","Hors du feu, déchirer la mozzarella par-dessus pour la faire fondre."],
sci:"La cuisson par absorption permet à l'amidon des gnocchis de lier naturellement la sauce des tomates, rendant superflu l'ajout de crème ou de beurre."},

{id:45,t:"Salé",s:"Été",k:400,n:"Salade de pêches rôties, feta AOP et dinde fumée",
ing:["1 belle pêche jaune ferme","30g de feta AOP","80g de filet de dinde fumée","Lit massif de jeunes pousses de salade","Poivre"],
prep:["Couper la pêche en quartiers en gardant la peau.","Les saisir 1 minute par face sur une poêle très chaude sans matière grasse.","Dresser les jeunes pousses, disposer les quartiers de pêche chauds et les tranches de dinde.","Émietter la feta et poivrer."],
sci:"Le passage de la pêche sur la chaleur intense intensifie sa sucrosité par la réaction de Maillard, créant un assaisonnement qui évite le recours aux vinaigrettes lourdes."},

{id:46,t:"Salé",s:"Été",k:420,n:"Dorade au four, tomates grappes rôties et fenouil",
ing:["1 petite dorade (env. 150g chair nette)","Grappe de tomates cerises entières","Graines de fenouil","Fumet de poisson","Spray d'huile d'olive (env. 2g)"],
prep:["Placer la dorade entière dans un plat à four. Inciser la peau, saupoudrer de graines de fenouil.","Disposer la grappe de tomates à côté. Verser un demi-verre de fumet au fond.","Pulvériser un léger voile d'huile d'olive.","Cuire à 200°C pendant 20 minutes."],
sci:"La cuisson hydratée par l'évaporation du fumet empêche la dessiccation des fibres musculaires de la dorade sans noyer le poisson dans l'huile de friture."},

{id:47,t:"Salé",s:"Été",k:380,n:"Rouleaux de légumes d'été frais au thon",
ing:["1 belle courgette droite","1 concombre","50g fromage frais 0%","80g thon au naturel en boîte","Ciboulette"],
prep:["À la mandoline, tailler des lamelles très fines et longues dans la courgette crue et le concombre.","Mélanger le thon égoutté avec le fromage frais et la ciboulette.","Déposer une cuillère de rillettes de thon à l'extrémité d'une lamelle.","Rouler fermement. Répéter l'opération."],
sci:"Substitution créative du wrap par un contenant végétal croquant. Résultat : repas ultra low-carb, protéiné, hydratant et rafraîchissant."},

{id:48,t:"Salé",s:"Été",k:440,n:"Gratin d'aubergines allégé à la pulpe de tomate",
ing:["2 aubergines","Coulis de tomate nature","100g viande de bœuf hachée maigre (5% MG)","20g de gruyère râpé","Herbes de Provence"],
prep:["Couper les aubergines en tranches et les pré-cuire à la vapeur ou micro-ondes 10 min.","Faire dorer le bœuf à sec, ajouter le coulis de tomate.","Alterner les couches d'aubergines vapeur et de sauce à la viande.","Saupoudrer de gruyère et gratiner 15 min au four."],
sci:"Saturer la chair spongieuse de l'aubergine d'eau à la vapeur bloque physiquement l'absorption des graisses de la viande lors du gratinage final."},

{id:49,t:"Salé",s:"Été",k:410,n:"Salade d'épeautre aux poivrons grillés et chèvre frais",
ing:["100g d'épeautre cuit","Poivrons rouges et jaunes","30g de fromage de chèvre frais","Vinaigre de Xérès"],
prep:["Placer les poivrons entiers sous le gril du four jusqu'à ce que la peau noircisse (20 min).","Les enfermer dans un sac plastique 10 min, puis peler, épépiner et tailler en lanières.","Mélanger la chair des poivrons avec l'épeautre cuit et un trait de vinaigre.","Ajouter des morceaux de chèvre frais."],
sci:"Le retrait de la pellicule cellulosique des poivrons grillés les rend digestes et libère leur douceur glucidique naturelle, s'accordant à la perfection avec le chèvre."},

{id:50,t:"Salé",s:"Été",k:420,n:"Poêlée de calamars persillés, ail et tomates",
ing:["150g d'anneaux de calamar crus","2 gousses d'ail hachées","Persil plat","Dés de tomates fraîches","100g de pommes de terre grenailles"],
prep:["Cuire les pommes de terre à l'eau ou vapeur, puis les faire sauter avec un spray d'huile.","Dans une poêle très chaude, saisir les calamars très rapidement (2 à 3 min max).","Ajouter l'ail et les dés de tomates. Parsemer de persil.","Servir ensemble."],
sci:"Le céphalopode est l'une des protéines marines les plus maigres (moins de 2% de MG) tout en offrant un collagène structurel à mastication ferme et rassasiante."},

// ─── AUTOMNE ───
{id:51,t:"Salé",s:"Automne",k:430,n:"Crumble d'hiver à la courge butternut et raclette",
ing:["250g courge butternut","30g fromage à raclette","15g noisettes concassées"],
prep:["Peler et couper la butternut en cubes. Rôtir au four avec sel et poivre 25 min à 200°C.","Placer les cubes chauds dans un ramequin.","Déposer la raclette sur le dessus, saupoudrer de noisettes.","Repasser sous le gril 3 minutes jusqu'à ce que le fromage fonde."],
sci:"Le fondant amylacé de la butternut mime la pomme de terre en divisant les calories par deux. La portion stricte de fromage (30g) satisfait le besoin lipidique sans excès."},

{id:52,t:"Salé",s:"Automne",k:400,n:"Velouté de potimarron aux éclats de châtaignes",
ing:["300g de potimarron bio (avec la peau)","Bouillon végétal","40g de châtaignes rôties","1 c.à.s crème légère"],
prep:["Laver le potimarron, retirer les graines mais conserver la peau. Couper en cubes.","Plonger dans le bouillon frémissant 20 min.","Mixer finement avec la crème légère.","Servir parsemé des châtaignes émiettées."],
sci:"La peau du potimarron décuple l'apport en fibres insolubles. Les châtaignes fournissent des glucides complexes exempts de gluten pour une satiété prolongée."},

{id:53,t:"Salé",s:"Automne",k:410,n:"Omelette forestière d'automne au chèvre",
ing:["2 œufs entiers","150g champignons de Paris ou cèpes","30g de bûche de chèvre","½ oignon rouge","Persil frais"],
prep:["Nettoyer et émincer les champignons.","Faire revenir l'oignon rouge et les champignons sans matière grasse jusqu'à évaporation de l'eau.","Battre les œufs, verser sur les champignons, ajouter le chèvre en morceaux.","Cuire à feu doux."],
sci:"Les champignons apportent des fibres spécifiques (chitine) et des bêta-glucanes stimulant l'immunité. Les protéines de l'œuf stabilisent la glycémie, prévenant les fringales."},

{id:54,t:"Salé",s:"Automne",k:440,n:"Risotto aux chanterelles et pointe de bleu d'Auvergne",
ing:["50g de riz rond","100g de chanterelles fraîches","Bouillon végétal","20g de fromage bleu (Roquefort)"],
prep:["Faire nacrer le riz à sec. Mouiller progressivement avec le bouillon pendant 18 min.","Saisir les chanterelles à part.","En fin de cuisson, intégrer les champignons.","Hors du feu, lier avec les 20g de bleu écrasé à la fourchette."],
sci:"La puissance aromatique extrême du fromage bleu permet d'en utiliser une quantité infime (20g) tout en parfumant intensément la totalité du riz, offrant un leurre sensoriel de richesse."},

{id:55,t:"Salé",s:"Automne",k:430,n:"Courge butternut farcie au chèvre et quinoa blond",
ing:["½ petite butternut évidée","80g de quinoa complet","30g de fromage de chèvre","Herbes de Provence"],
prep:["Couper la butternut en deux, retirer les graines. Quadriller la chair, cuire au four à 200°C 40 min.","Cuire le quinoa à l'eau.","Récupérer un peu de chair creusée, mélanger au quinoa et au chèvre.","Farcir la demi-courge, gratiner 5 min."],
sci:"La courge évidée sert de contenant comestible à très faible charge calorique, tandis que le quinoa fournit tous les acides aminés essentiels à la réparation tissulaire."},

{id:56,t:"Salé",s:"Automne",k:420,n:"Soupe épaisse de lentilles corail, courge et épices",
ing:["60g de lentilles corail sèches","150g de courge en cubes","Cumin, curcuma","1 c.à.s de lait de coco"],
prep:["Rincer les lentilles corail. Mettre dans une casserole avec les cubes de courge et les épices.","Couvrir d'eau ou de bouillon et mijoter 20 min.","Les lentilles vont se désagréger et lier la soupe naturellement.","En fin de cuisson, ajouter le lait de coco pour l'onctuosité."],
sci:"Le bêta-carotène de la matrice orangée s'associe au fer végétal des lentilles. Les lipides du lait de coco optimisent l'absorption des vitamines liposolubles."},

{id:57,t:"Salé",s:"Automne",k:440,n:"Pâtes complètes aux champignons forestiers et crème",
ing:["50g de pâtes complètes (cru)","200g de champignons forestiers variés","2 c.à.s crème fraîche 15% MG","Ail, persil"],
prep:["Cuire les pâtes al dente.","Émincer l'ail et les champignons, les faire suer fortement pour évaporer l'eau.","Baisser le feu, ajouter la crème légère, l'ail et le persil.","Mélanger cette sauce crémeuse aux pâtes égouttées."],
sci:"Les pâtes complètes libèrent progressivement leur glucose. Le volume imposant des champignons gorgés d'eau trompe visuellement le cerveau sur la taille énergétique réelle."},

{id:58,t:"Salé",s:"Automne",k:410,n:"Croque-monsieur végétarien champignons et emmental",
ing:["2 tranches pain de mie complet","Béchamel allégée : 100ml lait écrémé, 1 c.à.c maïzena, muscade","100g champignons de Paris","20g emmental"],
prep:["Préparer la béchamel en faisant épaissir le lait froid avec la maïzena et la muscade.","Saisir les champignons émincés.","Monter le croque : pain, béchamel, champignons, béchamel, pain, emmental.","Dorer au four 10 min."],
sci:"Le remplacement du jambon par des champignons augmente la teneur en fibres et réduit l'apport en sodium délétère pour le système cardiovasculaire."},

{id:59,t:"Salé",s:"Automne",k:430,n:"Tarte rustique aux champignons sans moule et œuf",
ing:["40g pâte brisée","200g de champignons émincés","1 œuf","Herbes de Provence","Un trait de lait"],
prep:["Étaler la pâte très finement sur un papier cuisson (pas de moule).","Disposer au centre les champignons sautés en laissant 3 cm de bord.","Rabattre grossièrement les bords sur la garniture (style rustique).","Verser l'œuf battu avec un peu de lait sur les champignons. Cuire 25 min à 190°C."],
sci:"Étaler la pâte ultra-fine réduit mathématiquement la quantité de farine et de beurre, tout en conservant le support croustillant psycho-sensoriel."},

{id:60,t:"Salé",s:"Automne",k:400,n:"Salade tiède de betteraves rôties, feta et noix",
ing:["200g de betteraves crues","Lit de jeunes pousses","30g de feta","10g de cerneaux de noix","Vinaigre balsamique"],
prep:["Éplucher les betteraves, les couper en quartiers.","Rôtir au four à 200°C pendant 45 min. Laisser tiédir.","Dresser sur les jeunes pousses, ajouter la feta émiettée et les noix.","Assaisonner au vinaigre balsamique sans huile."],
sci:"La torréfaction au four concentre les sucres naturels de la betterave, créant un contraste biochimique parfait avec l'acidité saline et lactique de la feta."},

{id:61,t:"Salé",s:"Automne",k:410,n:"Faux taboulé d'automne au chou-fleur et porc grillé",
ing:["150g chou-fleur cru mixé en semoule","120g de côte de porc (première)","Moutarde forte","Persil"],
prep:["Préparer le chou-fleur en semoule au mixeur.","Dégraisser soigneusement la côte de porc à cru (enlever toute la barde blanche).","Griller la viande à sec dans une poêle très chaude.","En fin de cuisson, badigeonner de moutarde forte. Servir avec la semoule végétale."],
sci:"Repas low-carb extrême. La moutarde, quasi acalorique, relève violemment le profil aromatique des viandes maigres sans plomber le bilan énergétique."},

{id:62,t:"Salé",s:"Automne",k:420,n:"Pâtes de lentilles vertes et salade de mâche aux noix",
ing:["50g de pâtes de farine de lentilles vertes (cru)","Poignée de champignons sautés","Grosse poignée de mâche","5 cerneaux de noix","Citron"],
prep:["Cuire les pâtes de légumineuses (cuisson rapide, 4 à 5 min pour éviter l'effritement).","Les mélanger chaudes avec les champignons sautés à sec.","Dresser à côté une belle salade de mâche assaisonnée de citron.","Garnir de noix concassées."],
sci:"Les pâtes de lentilles offrent un ratio protéine/glucide largement supérieur aux pâtes de blé, idéal pour la balance azotée sous restriction."},

{id:63,t:"Salé",s:"Automne",k:410,n:"Velouté de pois cassés, poireaux et œuf dur émietté",
ing:["50g de pois cassés secs","1 gros blanc de poireau","1 œuf entier","Bouillon végétal","Thym"],
prep:["Cuire l'œuf dur (10 min). Rincer les pois cassés. Émincer le poireau.","Réunir le poireau, les pois cassés, le thym et le bouillon.","Frémir 45 min jusqu'à écrasement total. Mixer si désiré.","Servir très chaud, surmonté de l'œuf dur finement émietté."],
sci:"Les pois cassés représentent une matrice extrêmement dense en énergie lente et en fibres. L'œuf dur émietté ajoute une texture mâchable, indispensable pour éviter la faim post-soupe."},

{id:64,t:"Salé",s:"Automne",k:440,n:"Filet mignon à la moutarde en cocotte et champignons",
ing:["120g filet mignon de porc","150g champignons de Paris","100g pommes de terre","1 c.à.s moutarde","1 c.à.s crème légère 15%"],
prep:["Couper la viande en tranches épaisses. Dorer sans graisse dans une cocotte.","Ajouter les champignons émincés (ils rendent leur eau). Couvrir et mijoter 15 min.","Hors du feu, incorporer le mélange moutarde/crème.","Cuire les pommes de terre à la vapeur pour accompagner."],
sci:"La cuisson lente en milieu humide maintient l'hydratation intramusculaire de cette viande très maigre, empêchant un résultat sec et filandreux."},

{id:65,t:"Salé",s:"Automne",k:450,n:"Magret de canard à l'orange (portion sous contrôle)",
ing:["100g de chair de magret de canard (pesée SANS la peau)","1 orange fraîche (jus et zestes)","1 c.à.c miel","100g carottes rôties"],
prep:["Étape cruciale : retirer intégralement la couche de graisse sous-cutanée du magret cru.","Rôtir la chair rouge à la poêle à feu vif (cuisson rosée).","Déglacer avec le jus d'orange, le zeste et le miel pour une sauce sirupeuse.","Servir nappé de sauce avec les carottes rôties."],
sci:"Dégraisser mécaniquement le magret retire 80% de son apport calorique originel. Il ne reste que le fer héminique pur, les protéines nobles, et le plaisir du plat festif."},

{id:66,t:"Salé",s:"Automne",k:420,n:"Poisson blanc et légumes racines d'automne à la plaque",
ing:["150g dos de cabillaud ou églefin","100g patate douce en dés","Carottes, navets en gros morceaux","Filet d'huile (3g)","Thym"],
prep:["Disposer tous les légumes sur la plaque du four avec papier cuisson.","Vaporiser d'huile et de thym, cuire à 200°C pendant 25 min.","Sortir, déposer le poisson blanc au milieu des légumes.","Remettre au four 10 minutes pour cuire le poisson."],
sci:"La méthode One-Pan caramélise l'extérieur des légumes racines en concentrant leur humidité. Le poisson, déposé en fin de cuisson, cuit doucement en absorbant les sucs végétaux."},

{id:67,t:"Salé",s:"Automne",k:430,n:"Tarte fine aux poires d'automne et pointe de roquefort",
ing:["3 feuilles de pâte filo","1 belle poire (type Conférence)","20g de roquefort émietté","Lit massif de roquette"],
prep:["Superposer les 3 feuilles de pâte filo.","Peler et trancher la poire en lamelles très fines. Disposer sur la pâte.","Enfourner à 180°C pendant 15 min.","À la sortie, parsemer de roquefort qui va fondre. Servir avec la roquette."],
sci:"Le roquefort apporte une sapidité si intense qu'elle compense largement la taille réduite de la portion. Synergie sucrée-salée d'une grande sophistication."},

{id:68,t:"Salé",s:"Automne",k:390,n:"Quiche sans pâte aux poireaux fondants et chèvre",
ing:["150g fondue de blancs de poireaux","2 œufs","100ml lait écrémé","Muscade","30g bûche de chèvre"],
prep:["Bien égoutter la fondue de poireaux.","Battre les œufs avec le lait écrémé, la muscade, sel et poivre.","Disposer les poireaux au fond d'un moule en silicone. Verser l'appareil.","Déposer les rondelles de chèvre en surface. Enfourner 30 min à 180°C."],
sci:"L'élimination de la pâte brisée économise 200 kcal de graisses saturées et glucides raffinés, sans altérer la texture du cœur du plat."},

{id:69,t:"Salé",s:"Automne",k:440,n:"Salade d'épeautre, pesto de cheddar et courges",
ing:["80g de petit épeautre cuit","Cubes de courge grillés au four","15g de cheddar affiné","Un peu de lait","Herbes"],
prep:["Cuire l'épeautre et griller les dés de courge au four.","Faire fondre à feu doux le cheddar râpé avec un filet de lait pour créer une sauce fromagère fluide.","Mélanger l'épeautre tiède et les courges.","Napper de cette sauce au cheddar."],
sci:"La pointe de cheddar fondu et étirée en sauce trompe efficacement les récepteurs du circuit dopaminergique de la récompense cérébrale."},

{id:70,t:"Salé",s:"Automne",k:420,n:"Poulet rôti aux herbes d'automne et frites de panais",
ing:["120g cuisse ou haut de cuisse (pesé SANS peau)","150g de panais","Romarin, thym","Fleur de sel"],
prep:["Retirer la peau du poulet. Frotter la viande avec les herbes.","Peler le panais, couper en forme de frites épaisses.","Placer le poulet et les frites de panais sur une plaque au four.","Rôtir à 200°C pendant 35 à 40 minutes."],
sci:"Le panais possède un goût suave, terreux et sucré. Son réseau de fibres insolubles favorise un fort effet rassasiant tout au long du processus digestif."},

{id:71,t:"Salé",s:"Automne",k:390,n:"Endives braisées au jambon blanc et béchamel légère",
ing:["2 grosses endives","2 tranches de jambon blanc supérieur","Béchamel allégée : 100ml lait écrémé, 1 c.à.c maïzena"],
prep:["Évider la base amère des endives. Les braiser à l'étouffée avec un fond de bouillon 30 min.","Égoutter et presser les endives. Les enrouler dans le jambon.","Préparer la béchamel, en napper les endives.","Gratiner 10 min."],
sci:"Les composés phénoliques de l'endive stimulent les sécrétions biliaires, facilitant le métabolisme et le drainage global."},

{id:72,t:"Salé",s:"Automne",k:450,n:"Boudin noir aux pommes (portion ajustée et contrôlée)",
ing:["80g de boudin noir classique","1 à 2 belles pommes (Golden ou reinette)"],
prep:["Couper les pommes en gros quartiers (garder la peau si bio).","Les compoter à sec à feu doux et à couvert, sans eau ni beurre, jusqu'à translucidité.","Inciser la peau du boudin, le cuire à la poêle très chaude sans graisse.","Servir le boudin avec la compotée naturelle."],
sci:"Ce plat cible les déficits en fer, fréquents dans les régimes hypocaloriques. L'absorption intestinale du fer héminique de cette charcuterie sanguine est excellente et vitale."},

{id:73,t:"Salé",s:"Automne",k:430,n:"Sauté de dinde aux marrons entiers et carottes",
ing:["120g de blanc de dinde émincé","50g de marrons entiers (boîte ou sous vide)","150g carottes en rondelles","Bouillon clair"],
prep:["Faire revenir la dinde dans une cocotte antiadhésive, réserver.","Cuire les rondelles de carottes dans le bouillon 15 min.","Ajouter la dinde et les marrons entiers en fin de cuisson.","Réchauffer dans le jus aromatique (attention, les marrons s'écrasent si bouillent trop)."],
sci:"Contrairement aux oléagineux (bombes lipidiques), les marrons sont des fruits amylacés très pauvres en graisses, offrant une texture farineuse automnale incomparable."},

{id:74,t:"Salé",s:"Automne",k:410,n:"Poêlée paysanne choux de Bruxelles et lardons maigres",
ing:["200g choux de Bruxelles","50g d'allumettes de bacon de dinde","½ oignon émincé"],
prep:["Blanchir les choux de Bruxelles à l'eau bouillante salée 10 min, puis les couper en deux.","Faire revenir l'oignon et le bacon de dinde fumé.","Ajouter les moitiés de choux et faire sauter à feu vif.","Caraméliser les bords des légumes."],
sci:"Les crucifères sont riches en glucosinolates, molécules protectrices cellulaires. Le bacon de dinde apporte le côté fumé réconfortant essentiel au moral."},

{id:75,t:"Salé",s:"Automne",k:420,n:"Riz complet aux cœurs d'artichauts et tomates confites",
ing:["80g riz complet cru","100g cœurs d'artichauts (en bocal au naturel)","3 moitiés de tomates séchées (sans huile)","Basilic frais"],
prep:["Cuire le riz complet (env. 40 min).","Rincer les cœurs d'artichauts à l'eau claire, les couper en quartiers.","Émincer les tomates séchées.","Mélanger le riz chaud avec les artichauts, les tomates, et le basilic frais déchiré."],
sci:"L'artichaut contient de grandes quantités d'inuline prébiotique qui nourrit le microbiote intestinal, crucial pour l'extraction calorique et la régulation de l'humeur."},

{id:76,t:"Salé",s:"Hiver",k:420,n:"Brandade de cabillaud maison revisitée et allégée",
ing:["120g de cabillaud frais (non salé)","100g pommes de terre","3 cl lait écrémé","1 gousse d'ail, thym","1 c.à.c huile d'olive (5g)","5g chapelure"],
prep:["Éplucher et cuire les pommes de terre à l'eau avec l'ail et le thym.","Pocher le cabillaud dans cette eau aromatisée jusqu'à effritement.","Écraser les pommes de terre en ajoutant le lait écrémé et l'huile d'olive. Incorporer le poisson effeuillé.","Mettre en ramequin, saupoudrer de chapelure, gratiner."],
sci:"L'utilisation du lait écrémé et du poisson frais permet de diviser la charge lipidique par deux par rapport à la brandade traditionnelle noyée d'huile d'olive."},

{id:77,t:"Salé",s:"Hiver",k:430,n:"Tielle Sétoise déconstruite en chausson léger",
ing:["40g pâte à pain/pizza très fine","150g poulpe/calamar","1 c.à.s concentré tomate","Oignon, ail, vin blanc","Safran, piment"],
prep:["Faire suer ail et oignon sans huile. Ajouter le poulpe en brunoise. Déglacer au vin blanc.","Ajouter le concentré de tomate, le safran et le piment. Mijoter 20 min.","Étaler les 40g de pâte extrêmement finement. Garnir de ragout.","Refermer en demi-lune (chausson). Cuire au four 20 min à 200°C."],
sci:"La déconstruction en chausson à croûte millimétrique préserve l'essence iodée de la tielle classique tout en amputant massivement glucides et lipides."},

{id:78,t:"Salé",s:"Hiver",k:450,n:"Bœuf bourguignon maigre et carottes fondantes",
ing:["120g bœuf (macreuse dégraissée)","200g carottes en rondelles","Oignons grelots, champignons","1 verre de vin rouge","1 c.à.c maïzena","Bouquet garni"],
prep:["Dorer la viande à sec dans une cocotte en fonte. Ajouter oignons, carottes, bouquet garni.","Verser le vin rouge et du bouillon maigre.","Mijoter à feu très doux pendant 2 heures minimum.","En fin de cuisson, lier avec la maïzena diluée dans de l'eau froide (pas de beurre manié)."],
sci:"Le mijotage lent rend les viandes maigres et dures parfaitement fondantes. L'alcool du vin s'évapore, ne laissant que les tanins antioxydants et la couleur."},

{id:79,t:"Salé",s:"Hiver",k:390,n:"Velouté soyeux de chou-fleur, pomme et Saint-Jacques",
ing:["200g de chou-fleur","½ pomme (type Gala)","3 noix de Saint-Jacques sans corail","Bouillon végétal","Poivre noir"],
prep:["Cuire le chou-fleur et la pomme épluchée dans le bouillon.","Mixer très finement pour une texture de velours (la pomme apporte la liaison sucrée).","Snacker les noix de Saint-Jacques 1 min par face dans une poêle très chaude à sec.","Dresser les noix sur le velouté chaud."],
sci:"Les noix de Saint-Jacques sont des blocs de protéines pures, extrêmement pauvres en graisses. L'alliance chou-fleur/pomme adoucit les composés soufrés du chou."},

{id:80,t:"Salé",s:"Hiver",k:420,n:"Salade de chou rouge croquant aux noix et poulet",
ing:["150g chou rouge","120g blanc de poulet rôti (froid)","15g cerneaux de noix","Vinaigrette : 1 c.à.c huile de colza, vinaigre de cidre, moutarde"],
prep:["Émincer le chou rouge finement à la mandoline.","Le masser vigoureusement avec du sel 2 minutes pour casser la rigidité des fibres.","Assaisonner avec la vinaigrette au colza.","Disposer les tranches de poulet froid et parsemer de noix."],
sci:"Le chou cru exige une énergie masticatoire importante, augmentant l'effet thermique du repas. L'huile de colza et les noix apportent les oméga-3 essentiels pour l'hiver."},

{id:81,t:"Salé",s:"Hiver",k:440,n:"Curry de légumes racines d'hiver et tofu soyeux",
ing:["100g de tofu ferme ou soyeux en dés","Épices curry de Madras","2 c.à.s lait de coco allégé","200g mélange carottes/navets/poireaux","50g de riz basmati cru"],
prep:["Cuire le riz. Faire suer les légumes d'hiver émincés dans une sauteuse.","Saupoudrer de curry et bien enrober. Ajouter un fond d'eau, mijoter.","Incorporer les dés de tofu et le lait de coco en fin de cuisson.","Servir avec le riz."],
sci:"Les épices réchauffantes augmentent la thermogenèse post-prandiale. Ce plat en sauce offre un volume réconfortant et hautement rassasiant."},

{id:82,t:"Salé",s:"Hiver",k:380,n:"Cabillaud en potée marine et légumes racines",
ing:["130g de dos de cabillaud","200g légumes pot-au-feu (navets, carottes, céleri, poireaux)","Clous de girofle","Bouillon végétal clair"],
prep:["Préparer un bouillon aromatisé avec thym, laurier et clous de girofle.","Plonger les légumes en gros tronçons. Mijoter 40 min.","Baisser le feu, pocher le cabillaud 7 minutes dans le bouillon chaud.","Servir dans une assiette creuse."],
sci:"Le céleri branche, riche en phtalides organiques, agit comme draineur hépatique sans apporter de calorie significative à la ration."},

{id:83,t:"Salé",s:"Hiver",k:450,n:"Saumon rôti sur lit de frites de carottes au four",
ing:["120g pavé de saumon frais (avec peau)","200g de grosses carottes","Paprika fumé","Spray d'huile d'olive (2g)","Fleur de sel"],
prep:["Tailler les carottes en bâtonnets de frites. Vaporiser d'huile, saupoudrer de paprika.","Cuire à 220°C pendant 20 min.","Sortir, placer le saumon au centre des frites.","Remettre au four 12 min."],
sci:"La cuisson prolongée déshydrate les carottes, permettant d'exprimer leurs sucres et de caraméliser. Le gras du saumon (EPA/DHA) lubrifie les articulations en hiver."},

{id:84,t:"Salé",s:"Hiver",k:430,n:"Gratin de poireaux d'hiver au saumon et parmesan",
ing:["200g blancs de poireaux","100g saumon frais en dés (sans peau)","1 c.à.s crème fraîche à 15%","15g parmesan râpé","Muscade"],
prep:["Couper les poireaux en rondelles, les précuire intensément à la vapeur.","Bien les essorer. Dans un plat à gratin, mélanger poireaux fondants, dés de saumon cru et crème.","Saupoudrer de parmesan et muscade.","Gratiner au four 15 min à 200°C."],
sci:"Le poireau est le diurétique hivernal par excellence. Associé au saumon, il forme un plat lourd en apparence mais structurellement très peu glucidique."},

{id:85,t:"Salé",s:"Hiver",k:410,n:"Soupe de poulet réconfortante à la patate douce",
ing:["100g restes de poulet rôti effiloché (sans peau)","100g patate douce","Rondelles de carottes","Bouillon de volaille","Feuilles de coriandre fraîche"],
prep:["Peler et couper patate douce et carottes en dés.","Les plonger dans le bouillon frémissant 20 min.","Ajouter la chair de poulet effilochée pour la réchauffer.","Servir dans un grand bol type « pho », parsemé de coriandre."],
sci:"La patate douce, riche en provitamine A, soutient l'intégrité des muqueuses respiratoires agressées par le froid et les virus."},

{id:86,t:"Salé",s:"Hiver",k:440,n:"Salade tiède de pois chiches, avocat et légumes rôtis",
ing:["100g pois chiches cuits (rincés)","30g avocat mûr (¼)","100g légumes d'hiver (navets, carottes) en dés","Jus de citron, cumin"],
prep:["Rôtir les dés de légumes avec du cumin au four 25 min.","Mélanger les pois chiches avec les légumes racines tièdes.","Ajouter l'avocat en lamelles.","Arroser de jus de citron (l'avocat fond légèrement au contact de la chaleur)."],
sci:"Les pois chiches combinent protéines végétales et fibres insolubles. L'avocat (riche en potassium) offre une onctuosité qui compense l'absence de vinaigrette."},

{id:87,t:"Salé",s:"Hiver",k:390,n:"Légumes d'hiver rôtis au sirop d'érable et bacon de dinde",
ing:["200g mélange panais, carottes et navets","1 c.à.c sirop d'érable","50g tranches de bacon de dinde fumé"],
prep:["Couper les racines en gros morceaux. Mélanger avec le sirop d'érable et du poivre sur une plaque.","Rôtir à 200°C pendant 30 min.","Ajouter les tranches de bacon de dinde pour les 5 dernières minutes.","Servir croustillant."],
sci:"Le sirop d'érable (~15 kcal) offre un effet caramélisé maximal sur les papilles. Le bacon de dinde est une protéine fumée de haute densité remplaçant le lardon."},

{id:88,t:"Salé",s:"Hiver",k:430,n:"Blanquette de veau allégée aux petits légumes",
ing:["120g de veau maigre dégraissé","Carottes, blancs de poireaux","Oignon piqué de clous de girofle","Bouquet garni","1 jaune d'œuf","1 c.à.s fromage blanc 0%","1 c.à.c jus de citron"],
prep:["Plonger la viande dans l'eau froide, porter à ébullition et écumer.","Ajouter les légumes et le bouquet garni. Mijoter 1h30.","Pour la sauce : battre le jaune d'œuf avec le fromage blanc 0% et le citron.","Ajouter une louche de bouillon chaud en fouettant. Verser sur la viande hors du feu."],
sci:"La substitution de la crème et du roux par un appareil jaune d'œuf/laitage écrémé conserve le nappage velouté emblématique tout en éliminant le coût lipidique."},

{id:89,t:"Salé",s:"Hiver",k:440,n:"Ramen au poulet maison et légumes croquants",
ing:["50g nouilles de riz fines","100g blanc de poulet","1 œuf entier","Feuilles de pak-choï ou poireau émincé","Bouillon de volaille infusé au miso"],
prep:["Chauffer le bouillon. Y plonger le poulet en tranches fines et le chou 5 minutes.","Cuire l'œuf mollet à part (6 min). Ébouillanter les nouilles 2 min.","Dans un grand bol, disposer nouilles, légumes, poulet.","Verser le bouillon brûlant. Déposer l'œuf coupé en deux au sommet."],
sci:"Le grand volume de bouillon chaud distend l'estomac de manière fulgurante, saturant immédiatement les signaux mécaniques de faim. L'œuf mollet ajoute l'onctuosité manquante."},

{id:90,t:"Salé",s:"Hiver",k:390,n:"Salade d'endives aux oranges et éclats de noix fraîches",
ing:["2 belles endives","1 orange (ou orange sanguine)","15g de noix décortiquées","80g de filet de dinde fumée"],
prep:["Retirer le cœur dur des endives et les émincer.","Peler l'orange à vif, extraire les suprêmes.","Mélanger les endives, les suprêmes d'orange, les allumettes de dinde et les noix.","Utiliser le jus de l'orange comme assaisonnement. Aucune huile nécessaire."],
sci:"L'acidité sucrée de l'orange casse biochimiquement l'amertume de l'endive. Apport massif en vitamine C, cruciale pour l'immunité hivernale."},

{id:91,t:"Salé",s:"Hiver",k:410,n:"Poireaux rôtis entiers au four et œuf mollet coulant",

        const generateTags = (name, type) => {
            const tags = [];
            const lower = name.toLowerCase();
            if (type === "Sucré") {
                if (/(porridge|pancakes|muesli|gaufres|pain perdu|bowl cake|tartine|crêpes|galette|brioche)/.test(lower)) tags.push("Petit-déj");
                if (/(smoothie|sandwich|wrap|brochettes|galette de riz|energy|bar)/.test(lower)) tags.push("Collation");
                if (/(gâteau|clafoutis|mousse|crumble|flan|tiramisu|brownie|tarte|pudding|riz au lait|sorbet|nice cream|cheesecake|verrine|pouding|cake|terrine)/.test(lower)) tags.push("Dessert");
                if (/(skyr|fromage blanc|cottage|yaourt|ricotta)/.test(lower)) tags.push("Laitier");
                if (/(chocolat|cacao)/.test(lower)) tags.push("Chocolat");
                if (/(fraise|framboise|myrtille|cerise|baies|fruits)/.test(lower)) tags.push("Fruits");
                if (/(chia|avoine|quinoa|épeautre|sarrasin)/.test(lower)) tags.push("Céréales");
            } else {
                if (/(poulet|dinde|volaille|canard|lapin)/.test(lower)) tags.push("Volaille");
                if (/(saumon|truite|cabillaud|loup|dorade|sardines|ceviche|crevettes|moules|calamars|anchois|saint-jacques|poisson|lieu|merlu|rouget|seiche|bar|espadon|daurade|tellines|haddock|lotte|pieuvre|couteaux|colin)/.test(lower)) tags.push("Mer");
                if (/(porc|veau|bœuf|jambon|bacon|boudin|lardons|agneau|taureau|canard|bresaola|fricandeau)/.test(lower)) tags.push("Viande");
                if (/(tofu|quinoa|lentilles|pois|fèves|végétarien|haricots)/.test(lower)) tags.push("Végétarien");
                if (/(œuf|omelette|frittata|œufs|pancakes)/.test(lower)) tags.push("Œufs");
                if (/(pâtes|riz|risotto|gnocchis|taboulé|nouilles|épeautre|galette|semoule|boulgour|orge|macaroni|linguine|sarrasin)/.test(lower)) tags.push("Féculents");
                if (/(salade|velouté|soupe|gaspacho|bouillon|bowl|ceviche)/.test(lower)) tags.push("Léger");
                if (/(chèvre|feta|pélardon|mozzarella|parmesan|fromage|roquefort|bleu|raclette|emmental|cheddar|brousse|ricotta)/.test(lower)) tags.push("Fromage");
            }
            return tags.slice(0, 3);
        };

                                        </button>
                                    ))}
                                </div>
                            )}

                            {activeTab === "preparation" && (
                                <div className="space-y-4 animate-fade-in">
                                    {dish.preparation.map((step, i) => (
                                        <div key={i} className="flex gap-3 p-3 bg-white rounded-xl border border-stone-100">
                                            <div className="step-num bg-terracotta/10 text-terracotta flex-shrink-0 mt-0.5">{i + 1}</div>
                                            <p className="text-sm text-stone-700 leading-relaxed font-sans">{step}</p>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="mt-6">
                                <button onClick={() => setShowScience(!showScience)}
                                    className="w-full flex items-center justify-between p-3 bg-white rounded-xl border border-stone-100 hover:border-stone-200 transition-all active:scale-[0.98]">
                                    <span className="text-sm font-semibold text-stone-700 flex items-center gap-2">🧬 Mécanisme physiologique</span>
                                    <span className={`transition-transform duration-200 text-stone-400 ${showScience ? 'rotate-180' : ''}`}><ChevronDown /></span>
                                </button>
                                {showScience && (
                                    <div className="mt-2 p-4 bg-gradient-to-br from-stone-50 to-stone-100/50 rounded-xl border border-stone-100 animate-fade-in">
                                        <p className="text-sm text-stone-600 leading-relaxed font-sans italic">{dish.science}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ══════════════════════════════════════════════════
        //  APP
        // ══════════════════════════════════════════════════

        const App = () => {
            const [searchQuery, setSearchQuery] = useState("");
            const [activeSeason, setActiveSeason] = useState("Tous");
            const [activeType, setActiveType] = useState("Tous");
            const [showFavorites, setShowFavorites] = useState(false);
            const [dishModal, setDishModal] = useState(null);
            const [favorites, setFavorites] = useState(() => {
                try { return new Set(JSON.parse(localStorage.getItem('occidiet_favs') || '[]')); }
                catch { return new Set(); }
            });

            const toggleFav = useCallback((id) => {
                setFavorites(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id); else next.add(id);
                    localStorage.setItem('occidiet_favs', JSON.stringify([...next]));
                    return next;
                });
            }, []);

            const seasons = ["Tous", "Printemps", "Été", "Automne", "Hiver"];
            const types = ["Tous", "Salé", "Sucré"];

            const filteredDishes = useMemo(() => {
                return dishes.filter(dish => {
                    const matchesSearch = dish.name.toLowerCase().includes(searchQuery.toLowerCase()) || dish.tags.some(tag => tag.toLowerCase().includes(searchQuery.toLowerCase()));
                    const matchesSeason = activeSeason === "Tous" || dish.season === activeSeason;
                    const matchesType = activeType === "Tous" || dish.type === activeType;
                    const matchesFav = !showFavorites || favorites.has(dish.id);
                    return matchesSearch && matchesSeason && matchesType && matchesFav;
                });
            }, [searchQuery, activeSeason, activeType, showFavorites, favorites]);

            const favCount = favorites.size;

            return (
                <div className="min-h-screen relative pb-24 sm:pb-12">
                    <header className="glass-panel sticky top-0 z-40 pt-12 pb-5 px-4 sm:px-12">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                            <div>
                                <h2 className="text-[10px] font-bold tracking-[0.2em] text-olive uppercase mb-1.5">Occitanie Diététique</h2>
                                <h1 className="font-serif text-3xl sm:text-5xl lg:text-6xl text-stone-900 leading-none">
                                    L'Architecture<br/><span className="italic text-terracotta">du Déficit.</span>
                                </h1>
                            </div>
                            <p className="font-sans text-stone-500 max-w-xs text-xs sm:text-right leading-relaxed">300 recettes cliniquement modélisées entre 380 et 450 kcal — salé & sucré.</p>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-12 pt-6">
                        {/* TYPE TOGGLE */}
                        <div className="flex items-center gap-2 mb-4">
                            {types.map(type => (
                                <button key={type} onClick={() => setActiveType(type)}
                                    className={`px-4 py-2 rounded-xl text-sm font-medium transition-all duration-300 ${activeType === type ? 'bg-stone-900 text-stone-50 shadow-md' : 'bg-white text-stone-600 border border-stone-200 hover:border-stone-300'}`}>
                                    {type === "Sucré" ? "🍰 " : type === "Salé" ? "🍽 " : ""}{type}
                                </button>
                            ))}
                            <button onClick={() => setShowFavorites(!showFavorites)}
                                className={`ml-auto flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-medium transition-all duration-300 ${showFavorites ? 'bg-red-50 text-red-600 border border-red-200 shadow-sm' : 'bg-white text-stone-500 border border-stone-200 hover:border-stone-300'}`}>
                                <HeartIcon filled={showFavorites} />
                                <span className="hidden sm:inline">{favCount > 0 ? favCount : ''}</span>
                            </button>
                        </div>

                        <div className="flex flex-col lg:flex-row gap-4 mb-8">
                            <div className="relative flex-grow">
                                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400"><SearchIcon /></div>
                                <input type="text" placeholder="Rechercher un plat, ingrédient, tag..."
                                    className="w-full pl-11 pr-4 py-3.5 bg-white border border-stone-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-olive/20 focus:border-olive transition-all font-sans text-sm text-stone-800 placeholder-stone-400"
                                    value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                            </div>
                            <div className="flex overflow-x-auto no-scrollbar gap-2 pb-1 lg:pb-0 items-center">
                                {seasons.map(season => (
                                    <button key={season} onClick={() => setActiveSeason(season)}
                                        className={`whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 ${activeSeason === season ? 'bg-stone-900 text-stone-50 shadow-md' : 'bg-white text-stone-600 border border-stone-200 hover:border-stone-300'}`}>
                                        {season !== "Tous" ? seasonEmoji[season] + " " : ""}{season}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {filteredDishes.length > 0 ? (
                            <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-5 lg:gap-6">
                                {filteredDishes.map((dish, index) => (
                                    <div key={dish.id} style={{ animationDelay: `${Math.min(index, 12) * 30}ms` }} className="animate-fade-in opacity-0">
                                        <DishCard dish={dish} onClick={() => setDishModal(dish)} isFav={favorites.has(dish.id)} onToggleFav={toggleFav} />
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="py-24 text-center">
                                <p className="font-serif text-2xl text-stone-400 mb-2">{showFavorites ? "Aucun favori pour le moment." : "Aucun plat trouvé."}</p>
                                <button onClick={() => { setSearchQuery(''); setActiveSeason('Tous'); setActiveType('Tous'); setShowFavorites(false); }} className="text-terracotta underline font-medium text-sm">Réinitialiser</button>
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-6 right-4 sm:bottom-10 sm:right-10 z-40">
                        <button onClick={() => { const pool = activeType === "Tous" ? dishes : dishes.filter(d => d.type === activeType); setDishModal(pool[Math.floor(Math.random() * pool.length)]); }}
                            className="group flex items-center justify-center gap-2 bg-terracotta text-white px-5 py-3.5 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all duration-300">
                            <DicesIcon /><span className="font-semibold tracking-wide text-sm hidden sm:block">Inspiration</span>
                        </button>
                    </div>

                    {dishModal && <RecipeModal dish={dishModal} onClose={() => setDishModal(null)} isFav={favorites.has(dishModal.id)} onToggleFav={toggleFav} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
