            if (/(œuf|omelette|frittata|œufs|pancakes)/.test(lower)) tags.push("Œufs");

        const fetchWithRetry = async (url, options, retries = 5, delay = 1000) => {
            try {
                const res = await fetch(url, options);
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return await res.json();
            } catch (e) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                throw e;
            }

                    const apiKey = "";

                    let promptText = `Tu es un chef gastronomique et diététicien clinicien. Crée la recette détaillée pour le plat "${dish.name}". Le repas complet doit faire environ ${dish.kcal} calories.`;
                    if (modifier) promptText += `\n\nCONTRAINTE REQUISE : Le client a demandé la modification suivante : "${modifier}". Adapte impérativement la recette et les ingrédients pour respecter cette demande, tout en gardant l'apport autour de ${dish.kcal} kcal. Mentionne le changement dans l'astuce.`;

                    const payload = {
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    ingredients: { type: "ARRAY", items: { type: "STRING" } },
                                    instructions: { type: "ARRAY", items: { type: "STRING" } },
                                    astuce: { type: "STRING" }
                                },
                                required: ["ingredients", "instructions", "astuce"]
                            }
                        }
                    };

                    const data = await fetchWithRetry(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                    const contentText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!contentText) throw new Error("Réponse vide");
                    setRecipe(JSON.parse(contentText));
                } catch (e) {
                    console.error(e);
                    setError("Impossible de générer la recette pour le moment. Veuillez réessayer.");
                } finally {
                    setLoading(false); setIsCustomizing(false);
                }
            };

            if (!dish) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
                    <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-md" onClick={onClose}></div>
                    <div className="relative w-full max-w-3xl bg-white rounded-[2rem] shadow-2xl overflow-hidden animate-slide-up my-auto max-h-[90vh] flex flex-col">
                        <button onClick={onClose} className="absolute top-4 right-4 z-30 p-2 bg-white/50 backdrop-blur-md rounded-full text-stone-800 hover:bg-white transition-colors">
                            <CloseIcon />
                        </button>
                        <div className="flex-shrink-0"><DishCard dish={dish} isFeatured={true} /></div>
                        <div className="p-6 sm:p-10 bg-white overflow-y-auto flex-grow">
                            {!recipe && !loading && !error && (
                                <div className="text-center py-4">
                                    {isRandomInsight && <p className="font-sans text-stone-500 text-sm mb-6">Une sélection parfaitement équilibrée pour votre objectif de 1400 kcal journaliers.</p>}
                                    <button onClick={() => fetchRecipe()} className="w-full sm:w-auto px-8 py-4 bg-stone-900 text-stone-50 rounded-2xl font-semibold tracking-wide hover:bg-stone-800 transition-colors flex items-center justify-center gap-3 mx-auto shadow-lg">
                                        <SparkleIcon /> Générer la Recette Détaillée (IA)
                                    </button>
                                </div>
                            )}
                            {loading && (
                                <div className="flex flex-col items-center justify-center py-12 text-terracotta">
                                    <LoaderIcon /><p className="mt-4 font-serif text-xl italic text-stone-600">Conception culinaire en cours...</p>
                                </div>
                            )}
                            {error && (
                                <div className="text-center py-8 text-red-500"><p>{error}</p><button onClick={() => fetchRecipe(customRequest || null)} className="mt-4 underline text-stone-800 hover:text-terracotta">Réessayer</button></div>
                            )}
                            {recipe && !loading && (
                                <div className="animate-fade-in text-left">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                        <div className="md:col-span-1">
                                            <h4 className="font-serif text-2xl font-semibold mb-4 text-olive border-b border-stone-100 pb-2">Ingrédients</h4>
                                            <ul className="space-y-3">
                                                {recipe.ingredients.map((ing, i) => (
                                                    <li key={i} className="text-sm text-stone-700 flex items-start gap-2"><span className="text-terracotta mt-0.5">•</span><span>{ing}</span></li>
                                                ))}
                                            </ul>
                                        </div>
                                        <div className="md:col-span-2">
                                            <h4 className="font-serif text-2xl font-semibold mb-4 text-terracotta border-b border-stone-100 pb-2">Préparation</h4>
                                            <ol className="space-y-4">
                                                {recipe.instructions.map((step, i) => (
                                                    <li key={i} className="text-sm text-stone-700 leading-relaxed flex items-start gap-3">
                                                        <span className="font-serif font-bold text-stone-300 text-lg leading-none mt-0.5">{i+1}.</span><span>{step}</span>
                                                    </li>
                                                ))}
                                            </ol>
                                        </div>
                                    </div>
                                    <div className="mt-8 p-5 bg-stone-50 border border-stone-100 rounded-2xl shadow-inner">
                                        <p className="text-sm text-stone-800"><span className="font-bold text-mustard">💡 Astuce du Chef :</span> {recipe.astuce}</p>
                                    </div>
                                    <div className="mt-8 pt-8 border-t border-stone-100">
                                        <h4 className="font-serif text-xl mb-4 text-stone-900">Adapter cette recette</h4>
                                        <div className="flex flex-col sm:flex-row gap-3">
                                            <input 
                                                type="text" placeholder="Ex: Rendre vegan, sans gluten..." 
                                                className="flex-grow px-5 py-3 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-olive/30 focus:border-olive transition-all"
                                                value={customRequest} onChange={e => setCustomRequest(e.target.value)} disabled={isCustomizing}
                                                onKeyDown={e => e.key === 'Enter' && customRequest && !isCustomizing && fetchRecipe(customRequest)}
                                            />
                                            <button 
                                                onClick={() => { setIsCustomizing(true); fetchRecipe(customRequest); }} disabled={!customRequest || isCustomizing}
                                                className="px-6 py-3 bg-olive text-white rounded-xl text-sm font-medium hover:bg-[#7a865f] disabled:opacity-50 transition-colors flex items-center justify-center gap-2 flex-shrink-0"
                                            >
                                                {isCustomizing ? <LoaderIcon /> : <SparkleIcon />} {isCustomizing ? "Adaptation..." : "Adapter (IA)"}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = useState("");
            const [activeSeason, setActiveSeason] = useState("Tous");
            const [dishModal, setDishModal] = useState(null);

            const seasons = ["Tous", "Printemps", "Été", "Automne", "Hiver"];

            const filteredDishes = useMemo(() => {
                return dishes.filter(dish => {
                    const matchesSearch = dish.name.toLowerCase().includes(searchQuery.toLowerCase()) || dish.tags.some(tag => tag.toLowerCase().includes(searchQuery.toLowerCase()));
                    const matchesSeason = activeSeason === "Tous" || dish.season === activeSeason;
                    return matchesSearch && matchesSeason;
                });
            }, [searchQuery, activeSeason]);

            return (
                <div className="min-h-screen relative pb-24 sm:pb-12">
                    <header className="glass-panel sticky top-0 z-40 pt-12 pb-6 px-6 sm:px-12">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-end justify-between gap-6">
                            <div>
                                <h2 className="text-sm font-bold tracking-[0.2em] text-olive uppercase mb-2">Occitanie Diététique</h2>
                                <h1 className="font-serif text-4xl sm:text-5xl lg:text-6xl text-stone-900 leading-none">
                                    L'Architecture<br/><span className="italic text-terracotta">du Déficit.</span>
                                </h1>
                            </div>
                            <p className="font-sans text-stone-500 max-w-xs text-sm sm:text-right">100 repas cliniquement modélisés entre 400 et 450 kcal pour une restriction optimale.</p>
                        </div>
                    </header>
                    <main className="max-w-7xl mx-auto px-6 sm:px-12 pt-8">
                        <div className="flex flex-col lg:flex-row gap-6 mb-12">
                            <div className="relative flex-grow">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-stone-400"><SearchIcon /></div>
                                <input type="text" placeholder="Rechercher par ingrédient, nom, mot-clé (ex: Saumon, Végétarien)..." className="w-full pl-12 pr-4 py-4 bg-white border border-stone-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-olive/20 focus:border-olive transition-all font-sans text-stone-800 placeholder-stone-400" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                            </div>
                            <div className="flex overflow-x-auto no-scrollbar gap-3 pb-2 lg:pb-0 items-center">
                                {seasons.map(season => (
                                    <button key={season} onClick={() => setActiveSeason(season)} className={`whitespace-nowrap px-6 py-3.5 rounded-2xl font-medium transition-all duration-300 ${activeSeason === season ? 'bg-stone-900 text-stone-50 shadow-md' : 'bg-white text-stone-600 border border-stone-200 hover:border-stone-300 hover:bg-stone-50'}`}>{season}</button>
                                ))}
                            </div>
                        </div>
                        {filteredDishes.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 lg:gap-8">
                                {filteredDishes.map((dish, index) => (
                                    <div key={dish.id} style={{ animationDelay: `${index * 50}ms` }} className="animate-fade-in opacity-0">
                                        <DishCard dish={dish} onClick={() => setDishModal({ dish, isRandom: false })} />
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="py-24 text-center">
                                <p className="font-serif text-3xl text-stone-400 mb-2">Aucun plat ne correspond à vos critères.</p>
                                <button onClick={() => {setSearchQuery(''); setActiveSeason('Tous');}} className="text-terracotta underline font-medium">Réinitialiser la recherche</button>
                            </div>
                        )}
                    </main>
                    <div className="fixed bottom-6 right-6 sm:bottom-10 sm:right-10 z-40">
                        <button onClick={() => setDishModal({ dish: dishes[Math.floor(Math.random() * dishes.length)], isRandom: true })} className="group flex items-center justify-center gap-3 bg-terracotta text-white px-6 py-4 rounded-full shadow-lg hover:shadow-xl hover:-translate-y-1 hover:bg-[#c47c61] transition-all duration-300">
                            <DicesIcon /><span className="font-semibold tracking-wide hidden sm:block">Inspiration</span>
                        </button>
                    </div>
                    {dishModal && <DishModal dish={dishModal.dish} isRandomInsight={dishModal.isRandom} onClose={() => setDishModal(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
